name: PHP lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Lint plugin
        run: php -l chronoiran-seo-api.php
      - name: Verify documented version
        run: |
          grep -q "Version: 0.4.1" chronoiran-seo-api.php
          grep -q '`0.4.1`' README.md
